# ╔═══════════════════════════════════════════════════════════╗
# ║              FamClaw Configuration                        ║
# ║  Use ${ENV_VAR} for secrets. See .env.example.           ║
# ╚═══════════════════════════════════════════════════════════╝

# ── Server ────────────────────────────────────────────────────────────────────
server:
  host: "0.0.0.0"          # Bind all interfaces — access from any device on LAN
  port: 8080
  # Secret key for signing tokens. Auto-generated on first boot if not set.
  # To persist: export FAMCLAW_SECRET=<generated-value>
  secret: "${FAMCLAW_SECRET}"
  # mDNS was removed in v0.5.x — access via the device IP (e.g. http://192.168.1.10:8080).
  # The mdns_name field is deprecated and retained for config compatibility only.
  mdns_name: "famclaw"

# ── LLM backend ───────────────────────────────────────────────────────────────
llm:
  # FamClaw is a gateway — the LLM runs elsewhere.
  # Configure via the web UI on first boot, or set here:
  #
  # Examples:
  #   Ollama on LAN:    http://192.168.1.10:11434
  #   OpenAI:           https://api.openai.com/v1
  #   Anthropic:        https://api.anthropic.com/v1
  base_url: ""
  model: ""
  # Per-call LLM request timeout in seconds. Each chat/tool call gets its
  # own context deadline. Default: 300 (5 minutes). Raise for slow models
  # on Raspberry Pi; lower for faster hardware.
  timeout_seconds: 300
  # api_key: ""  # required for cloud providers, omit for Ollama
  # Prefer: export FAMCLAW_LLM_API_KEY=<key> (env overrides YAML, no plaintext warning)

  # Vision model profile — used when a message carries an image attachment
  # (a photo sent on Telegram or Discord). Text-only messages always use the
  # normal per-user model. Set to the name of a profile below, or leave empty
  # to use the per-user endpoint for both (use when your main model is itself
  # vision-capable). Images are sent to the configured LLM endpoint, which
  # may be remote — they stay on-device only when that endpoint is local.
  # vision_profile: "vision"

  # Named LLM endpoints — override per-user model selection.
  # profiles:
  #   vision:
  #     base_url: "http://192.168.1.10:11434"
  #     model: "qwen2.5-vl:7b"
  #   cloud:
  #     base_url: "https://api.openai.com/v1"
  #     model: "gpt-4o-mini"
  #     api_key: "${OPENAI_API_KEY}"

  # System prompt injected for all family interactions
  system_prompt: |
    You are FamClaw, a helpful family AI assistant. You are friendly,
    patient, and age-appropriate in all your responses. You respect
    privacy and never share personal information. You follow the
    family's rules about what topics are appropriate.

  # Context window & generation limits
  max_context_tokens: 4096
  max_response_tokens: 512
  temperature: 0.7

# ── Family profiles ───────────────────────────────────────────────────────────
users:
  - name: "parent"
    display_name: "Parent"
    role: "parent"
    pin: "${PARENT_PIN}"   # Set via env var or web UI first-boot wizard
    color: "#6366f1"

  - name: "emma"
    display_name: "Emma"
    role: "child"
    age_group: "age_8_12"
    color: "#f59e0b"
    # Optional: per-user model override (e.g. simpler model for young children)
    # model: "tinyllama"

  - name: "lucas"
    display_name: "Lucas"
    role: "child"
    age_group: "under_8"
    color: "#10b981"

  - name: "sofia"
    display_name: "Sofia"
    role: "child"
    age_group: "age_13_17"
    color: "#ec4899"

# ── Messaging gateways ───────────────────────────────────────────────────────
# gateways:
#   telegram:
#     enabled: true
#     token: "${TELEGRAM_BOT_TOKEN}"
#   discord:
#     enabled: true
#     token: "${DISCORD_BOT_TOKEN}"
#   whatsapp:
#     enabled: false  # placeholder — not yet implemented

# ── Policy engine (OPA) ───────────────────────────────────────────────────────
# Default OPA policies are embedded in the binary. To override with custom
# rules from disk, uncomment and point at a directory containing .rego files
# and (optionally) JSON data files:
# policies:
#   dir: "/etc/famclaw/policies/family"
#   data_dir: "/etc/famclaw/policies/data"

# ── Approval workflow ─────────────────────────────────────────────────────────
approval:
  expiry_hours: 24

# ── Skill manager ─────────────────────────────────────────────────────────────
skills:
  dir: "./skills"
  # Run seccheck before installing any skill
  auto_seccheck: true
  # Reject skills that fail seccheck (set false to warn-only)
  block_on_fail: true
  # OpenClaw skill compatibility — import SKILL.md format
  openclaw_compat: true
  # MCP tool servers — tools discovered automatically via tools/list
  # mcp_servers:
  #   local-tools:
  #     transport: stdio
  #     command: seccheck
  #     args: ["--json"]
  #   remote-tools:
  #     transport: http
  #     url: "http://192.168.1.10:3001/mcp"
  #     headers:
  #       Authorization: "Bearer ${MCP_TOKEN}"

# ── Storage ───────────────────────────────────────────────────────────────────
storage:
  # SQLite database path
  db_path: "./data/famclaw.db"

# ── Security Scanning (HoneyBadger) ──────────────────────────────────────────
seccheck:
  # Master switch — when false, no scanning anywhere
  enabled: true

  # Install-time: scan skills before writing to disk
  auto_seccheck: true     # scan on `famclaw skill install`
  block_on_fail: true     # refuse install on FAIL verdict
  paranoia: "family"      # minimal | family | strict | paranoid

  # Runtime: async background scans (never blocks chat)
  runtime_scan: true           # enable async background scans
  rescan_interval: "168h"      # re-scan tools every 7 days
  async_scan_timeout: "60s"    # per-scan timeout
  quarantine_on_fail: true     # block tools after FAIL verdict
  notify_on_quarantine: true   # send parent notification on quarantine

# ── Built-in tools ───────────────────────────────────────────────────────────
# Uncomment to expose web_fetch to the LLM. Disabled by default.
#
# url_allowlist is REQUIRED when enabled — an empty list denies all fetches as
# an SSRF guard. Listed hostnames match exact + all subdomains automatically
# (so "wikipedia.org" covers "en.wikipedia.org"). http/https only.
#
# By default FamClaw ALLOWS private-network access (it is a home-LAN product
# that must reach co-located SearXNG/Playwright/llama-server). To block
# loopback/RFC1918/ULA at the dialer, set block_private_networks: true.
# The host allowlist still applies regardless.
#
# Below is a curated default list grouped by category. Remove categories you
# don't want; add your own family-relevant hosts under the local-region
# section. Conservative kid-safe sources — review for your family's needs.
#
# tools:
#   web_fetch:
#     enabled: false
#     allowed_roles: [parent]
#     max_bytes: 262144           # 256KB response cap
#     timeout_seconds: 15
#     block_private_networks: false  # opt-in: block loopback/RFC1918/ULA at the dialer
#     url_allowlist:
#       # Reference / general knowledge
#       - wikipedia.org
#       - simple.wikipedia.org    # plain-English Wikipedia for younger readers
#       - britannica.com
#       - merriam-webster.com
#       - dictionary.com
#       - thesaurus.com
#
#       # Education
#       - khanacademy.org
#       - ck12.org
#       - pbskids.org
#       - nasa.gov
#       - noaa.gov
#       - nationalgeographic.com
#       - smithsonianmag.com
#
#       # Weather
#       - weather.gov
#       - wunderground.com
#       - timeanddate.com
#       - accuweather.com
#
#       # News (kid-appropriate sources)
#       - npr.org
#       - bbc.com
#       - bbc.co.uk
#       - reuters.com
#       - apnews.com
#
#       # Government / civic
#       - usa.gov
#       - cdc.gov
#       - nih.gov
#       - state.gov
#
#       # Travel & outdoors
#       - tripadvisor.com         # may block automated UA — try fallback hosts
#       - nps.gov                 # national parks
#       - recreation.gov
#       - visittheusa.com
#
#       # Local-region preset (customize for your area)
#       # - <your-city>.org       # city government
#       # - <your-county>.gov     # county services
#       # - <local-paper>.com     # local news
#       # - <local-library>.org   # library catalog
#       # - <local-school-district>.org
#
#       # Family-specific
#       # - <school-portal-host>  # school grades/assignments portal
#       # - <pediatrician-host>   # doctor's office portal
#
#   # Web search (requires web_fetch.enabled=true — reuses its url_allowlist
#   # as the host gate; the search endpoint host must be allowlisted).
#   web_search:
#     enabled: false
#     allowed_roles: [parent]
#     endpoint: "http://localhost:8888"  # SearXNG JSON search URL
#     max_results: 8                     # default 8, hard-capped at 16
#     timeout_seconds: 30                # default 30s — a self-hosted SearXNG
#                                        # fans out to external engines that can
#                                        # exceed 10s; 30s avoids intermittent
#                                        # "deadline exceeded" failures (see
#                                        # fc-websearch-honest-failure)

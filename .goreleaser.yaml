version: 2

project_name: famclaw

builds:
  - id: famclaw
    main: ./cmd/famclaw
    binary: famclaw
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.Version={{.Version}}
    hooks:
      post:
        # Sign every darwin binary with a Developer ID Application
        # certificate, notarize it, and staple the Apple ticket — before
        # archiving, so the published tarballs contain the final signed
        # binary. This is a hard gate: with no signing credentials the hook
        # fails loudly and the release publishes nothing (an unsigned/ad-hoc
        # arm64 binary is SIGKILLed on launch, exit 137, #311; a
        # non-notarized binary is blocked by Gatekeeper after a browser
        # download, #214). Credentials come from the FAMCLAW_APPLE_* /
        # FAMCLAW_NOTARY_* environment variables — see docs/RELEASE.md.
        # Requires the macos-latest runner (codesign/notarytool are
        # macOS-only); linux targets are skipped via the OS guard below.
        - cmd: sh -c 'if [ "{{.Os}}" = "darwin" ]; then bash scripts/darwin-sign-notarize.sh "{{.Path}}"; fi'
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - "7"
    ignore:
      - goos: darwin
        goarch: arm

archives:
  - formats: [tar.xz]
    name_template: >-
      famclaw-{{ .Os }}-{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}

checksum:
  name_template: checksums.txt

signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - --bundle=${signature}
      - ${artifact}
      - --yes

sboms:
  - artifacts: archive
    cmd: syft
    args:
      - ${artifact}
      - --output
      - cyclonedx-json=${document}

changelog:
  sort: asc
  groups:
    - title: "New Features"
      regexp: '^feat'
      order: 0
    - title: "Bug Fixes"
      regexp: '^fix'
      order: 1
    - title: "Security"
      regexp: '^.*security|^.*vuln|^.*cve'
      order: 2
    - title: "Refactoring"
      regexp: '^refactor'
      order: 3
    - title: "Documentation"
      regexp: '^docs'
      order: 4
    - title: "Other"
      order: 999
  filters:
    exclude:
      - '^chore\(deps\)'
      - '^Merge'

release:
  prerelease: auto
  extra_files:
    - glob: scripts/install-rpi.sh

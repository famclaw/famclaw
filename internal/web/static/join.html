<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FamClaw — Join</title>
  <style>
    body { font-family: sans-serif; max-width: 360px; margin: 80px auto; padding: 0 1rem; }
    label { display: block; margin: .75rem 0 .25rem; font-size: 14px; color: #6b7280; }
    select, input { width: 100%; padding: .5rem; font-size: 1.25rem;
            box-sizing: border-box; margin-bottom: .5rem; }
    input#code { letter-spacing: .35rem; text-align: center; text-transform: uppercase; }
    button { width: 100%; padding: .75rem; font-size: 1rem; cursor: pointer; margin-top: .5rem; }
    .err { color: #c00; display: none; margin-top: .5rem; }
    .back { display: inline-block; margin-top: 1rem; font-size: 13px; color: #6b7280; text-decoration: underline; }
  </style>
</head>
<body>
  <h2>FamClaw</h2>
  <form id="f" autocomplete="off">
    <label for="name">Who are you?</label>
    <select id="name" name="name" required></select>
    <label for="code">Access code from your parent.</label>
    <input id="code" name="code" type="password" autocomplete="off"
           required placeholder="••••••••" maxlength="8">
    <button type="submit">Join</button>
    <p id="err" class="err"></p>
  </form>
  <a class="back" href="/">Back</a>
  <script>
    // Load the household directory (public by design — no credentials) and
    // populate the identity picker.
    fetch('/api/users/public', {credentials: 'same-origin'})
      .then(r => r.ok ? r.json() : [])
      .then(users => {
        const sel = document.getElementById('name');
        (users || []).forEach(u => {
          const opt = document.createElement('option');
          opt.value = u.name;
          opt.textContent = u.display_name;
          sel.appendChild(opt);
        });
      })
      .catch(() => {});
    const f = document.getElementById('f');
    const errEl = document.getElementById('err');
    f.addEventListener('submit', async e => {
      e.preventDefault();
      errEl.style.display = 'none';
      const name = document.getElementById('name').value;
      const code = document.getElementById('code').value.trim();
      try {
        const r = await fetch('/api/join', {
          method: 'POST',
          credentials: 'same-origin',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({name, code})
        });
        if (r.ok) {
          window.location.href = '/';
        } else if (r.status === 429) {
          const ra = parseInt(r.headers.get('Retry-After') || '', 10);
          const mins = Number.isFinite(ra) && ra > 0 ? Math.ceil(ra / 60) : 15;
          errEl.textContent = `Too many attempts. Please wait ${mins} minute${mins === 1 ? '' : 's'} and try again.`;
          errEl.style.display = 'block';
        } else {
          errEl.textContent = 'Incorrect access code. Please try again.';
          errEl.style.display = 'block';
        }
      } catch {
        errEl.textContent = 'Connection error. Please try again.';
        errEl.style.display = 'block';
      }
      document.getElementById('code').value = '';
    });
  </script>
</body>
</html>
